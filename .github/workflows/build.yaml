name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# CI 只做验证，不需要任何写权限。
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Lint frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test backend
        run: go test ./... -count=1

      - name: Vet backend
        run: go vet ./...

      - name: Build backend
        run: go build -trimpath -tags=jsoniter .
