name: publish

on:
  push:
    tags:
      - 'v*'

# 仅发布 GHCR 镜像：contents:read 供 checkout，packages:write 供 GHCR 推送。
permissions:
  contents: read
  packages: write

# 发布必须串行且不可取消，避免并发发布或重跑到一半被取消造成半发布。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 版本只信任触发本次运行的 Git 标签，且仅接受本 fork 的规范发布标签
      # vX.Y.Z-shenyanshu.N（数字段无前导零，fork 修订号 N>=1）。
      # 同时将 -shenyanshu. 折叠为 . 得到四段纯数字，按 X/Y/Z/N 数值比较
      # 计算是否数字最高，防止旧 tag 重跑回退 latest 浮动标签。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STRICT='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-shenyanshu\.([1-9][0-9]*)$'

          if ! [[ "${TAG}" =~ ${STRICT} ]]; then
            echo "ref '${TAG}' is not a canonical fork release tag (vX.Y.Z-shenyanshu.N, N>=1, no leading zeros)" >&2
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${TAG#v}" >> "$GITHUB_OUTPUT"

          NUM="${TAG#v}"
          NUM="${NUM//-shenyanshu./.}"

          # 逐段数值排序而非字典序，否则 0.10.0 会被误判低于 0.9.0
          sorted_versions() {
            git tag --list 'v*' | grep -E "${STRICT}" | sed -e 's/^v//' -e 's/-shenyanshu\././' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n
          }

          latest_all="$(sorted_versions | tail -n 1)"

          if [ "${latest_all}" = "${NUM}" ]; then is_latest=true; else is_latest=false; fi
          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"

      # 精确标签与无 v 版本始终发布；latest 仅在当前 tag 为数值最高的规范 fork 发布时更新。
      # 不生成 X.Y 等上游样式浮动标签，避免与上游语义混淆。
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version_no_v }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 多阶段 Dockerfile 在容器内从源码构建前端与后端，不依赖预构建产物。
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
