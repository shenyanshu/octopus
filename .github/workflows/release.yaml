name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# 发布必须串行且不可取消，避免并发发布或重跑到一半被取消造成半发布。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 版本只信任触发本次运行的 Git 标签，拒绝前导零等非规范 semver，避免误发布。
      # 同时基于本地全部严格 semver tag 数值比较 is_latest / is_latest_minor，
      # 防止旧 tag 重跑回退 GHCR 浮动标签或抢占 GitHub Latest。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STRICT='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if ! [[ "${TAG}" =~ ${STRICT} ]]; then
            echo "ref '${TAG}' is not a stable semver tag (no leading zeros)" >&2
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

          NUM="${TAG#v}"
          MAJOR="$(cut -d. -f1 <<<"${NUM}")"
          MINOR="$(cut -d. -f2 <<<"${NUM}")"

          # 逐段数值排序而非字典序，否则 0.10.0 会被误判低于 0.9.0
          sorted_versions() {
            git tag --list 'v*' | grep -E "${STRICT}" | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n
          }

          latest_all="$(sorted_versions | tail -n 1)"
          latest_series="$(sorted_versions | awk -F. -v maj="${MAJOR}" -v min="${MINOR}" '$1==maj && $2==min' | tail -n 1)"

          if [ "${latest_all}" = "${NUM}" ]; then is_latest=true; else is_latest=false; fi
          if [ "${latest_series}" = "${NUM}" ]; then is_latest_minor=true; else is_latest_minor=false; fi

          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"
          echo "is_latest_minor=${is_latest_minor}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update price
        run: python3 scripts/updatePrice.py

      - name: Build
        run: bash scripts/build.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # 先创建 draft Release 并上传资产；重跑时 action 会按 tag 更新同一 draft，可恢复。
      - name: Create draft Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/archives/*
          generate_release_notes: true
          draft: true
          prerelease: false
          tag_name: ${{ steps.version.outputs.version }}

      # 精确标签 v* 与无 v 版本始终发布；浮动标签仅在该 tag 数值最高时更新。
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.is_latest_minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TARGETPLATFORM 由 buildx 自动按平台提供，无需显式 build-args 传递。
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR 推送成功后才公开 draft；latest 标记与数值比较结果一致，旧 tag 重跑不会抢占。
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ steps.version.outputs.version }}" \
            --draft=false \
            --latest=${{ steps.version.outputs.is_latest }}
